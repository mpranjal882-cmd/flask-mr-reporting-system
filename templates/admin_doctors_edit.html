{% extends "base.html" %}
{% block title %}Edit Doctor{% endblock %}
{% block content %}
<h4>Edit Doctor</h4>
<form method="post">
  <div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" value="{{ doc.name }}" required></div>
  <div class="mb-3"><label class="form-label">Specialization</label><input class="form-control" name="specialization" value="{{ doc.specialization }}"></div>
  <div class="mb-3"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ doc.phone }}"></div>
  <div class="mb-3"><label class="form-label">Email</label><input class="form-control" name="email" type="email" value="{{ doc.email }}"></div>
  <button class="btn btn-primary">Update</button>
</form>
{% endblock %}
