{% extends "base.html" %}
{% block title %}Manage Hospitals{% endblock %}
{% block content %}
<h4>Hospitals 
  <a href="{{ url_for('admin_hospitals_add') }}" class="btn btn-sm btn-success float-end">➕ Add Hospital</a>
</h4>
<div class="table-responsive">
<table class="table table-striped table-hover">
  <thead><tr><th>#</th><th>Name</th><th>City</th><th>Phone</th><th>Actions</th></tr></thead>
  <tbody>
    {% for h in hospitals %}
      <tr>
        <td>{{ h.id }}</td>
        <td>{{ h.name }}</td>
        <td>{{ h.city }}</td>
        <td>{{ h.phone }}</td>
        <td>
          <a class="btn btn-sm btn-primary" href="{{ url_for('admin_hospitals_edit', hid=h.id) }}">Edit</a>
          <form method="post" action="{{ url_for('admin_hospitals_delete', hid=h.id) }}" class="d-inline" onsubmit="return confirm('Delete hospital?');">
            <button class="btn btn-sm btn-danger">Delete</button>
          </form>
        </td>
      </tr>
    {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
