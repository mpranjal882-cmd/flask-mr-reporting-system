{% extends "base.html" %}
{% block title %}Manage Doctors{% endblock %}
{% block content %}
<h4>Doctors 
  <a href="{{ url_for('admin_doctors_add') }}" class="btn btn-sm btn-primary float-end">➕ Add Doctor</a>
</h4>
<div class="table-responsive">
<table class="table table-striped table-hover">
  <thead><tr><th>#</th><th>Name</th><th>Specialization</th><th>Phone</th><th>Email</th><th>Actions</th></tr></thead>
  <tbody>
    {% for d in doctors %}
      <tr>
        <td>{{ d.id }}</td>
        <td>{{ d.name }}</td>
        <td>{{ d.specialization }}</td>
        <td>{{ d.phone }}</td>
        <td>{{ d.email }}</td>
        <td>
          <a class="btn btn-sm btn-primary" href="{{ url_for('admin_doctors_edit', doc_id=d.id) }}">Edit</a>
          <form method="post" action="{{ url_for('admin_doctors_delete', doc_id=d.id) }}" class="d-inline" onsubmit="return confirm('Delete doctor?');">
            <button class="btn btn-sm btn-danger">Delete</button>
          </form>
        </td>
      </tr>
    {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
