{% extends "base.html" %}
{% block title %}Edit Hospital{% endblock %}
{% block content %}
<div class="container mt-4">
  <h4 class="mb-3">Edit Hospital</h4>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Hospital Name *</label>
      <input type="text" name="name" class="form-control" value="{{ h.name }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Address</label>
      <textarea name="address" class="form-control" rows="2">{{ h.address }}</textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">City</label>
      <input type="text" name="city" class="form-control" value="{{ h.city }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Phone</label>
      <input type="text" name="phone" class="form-control" value="{{ h.phone }}">
    </div>
    <button type="submit" class="btn btn-success">Update Hospital</button>
    <a href="{{ url_for('admin_hospitals') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
